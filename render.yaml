services:
  - type: web
    name: personal-portfolio
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run db:seed && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        value: file:./dev.db
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: FORCE_SEED
        value: "0"

  - type: web
    name: sfl-lab
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./sfl-lab/Dockerfile
    dockerContext: ./sfl-lab
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
