<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Graph-RAG Vault · 知识图谱检索</title>
  <meta name="description" content="Obsidian 式双向链接 × Graph-RAG：种子检索 + 邻居扩展，关系图同步高亮出处。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand-block">
        <p class="eyebrow">Obsidian graph × RAG</p>
        <h1>Graph-RAG Vault</h1>
        <p class="lede">用双向链接织网，用检索增强回答。对比「纯向量」与「图谱扩展」，看邻居如何补全上下文。</p>
      </div>
      <dl class="stats" aria-label="库统计">
        <div><dt>笔记</dt><dd id="stat-notes">—</dd></div>
        <div><dt>链接</dt><dd id="stat-edges">—</dd></div>
      </dl>
    </header>

    <main class="stage">
      <section class="panel graph-panel" aria-label="知识关系图">
        <div class="panel-head">
          <div>
            <h2>关系图</h2>
            <p>点击节点阅读；问答后种子 / 邻居高亮。</p>
          </div>
          <ul class="legend" aria-label="图例">
            <li><span class="dot seed"></span>种子</li>
            <li><span class="dot neighbor"></span>邻居</li>
            <li><span class="dot base"></span>其余</li>
          </ul>
        </div>
        <div id="graph" role="img" aria-label="力导向知识图谱"></div>
      </section>

      <aside class="panel side-panel">
        <section class="ask-block" aria-label="提问">
          <div class="row-between">
            <h2>提问</h2>
            <div class="mode-toggle" role="group" aria-label="检索模式">
              <button type="button" class="mode active" data-mode="graph">Graph-RAG</button>
              <button type="button" class="mode" data-mode="vector">纯向量</button>
            </div>
          </div>
          <form id="ask-form">
            <label class="sr-only" for="query">问题</label>
            <textarea id="query" rows="3" placeholder="例如：Graph-RAG 怎么结合双向链接？" required></textarea>
            <div class="ask-actions">
              <button type="submit" id="ask-btn">检索并回答</button>
              <button type="button" id="reset-btn" class="ghost">清除</button>
            </div>
          </form>
          <div class="chips" aria-label="示例问题">
            <button type="button" class="chip" data-q="什么是原子笔记？">原子笔记</button>
            <button type="button" class="chip" data-q="RAG 的流水线有哪些步骤？">RAG 流水线</button>
            <button type="button" class="chip" data-q="Graph-RAG 如何扩展邻居？">Graph-RAG</button>
            <button type="button" class="chip" data-q="为什么本地优先适合做知识库？">本地优先</button>
            <button type="button" class="chip" data-q="双向链接和文件夹有什么差别？">双向链接</button>
          </div>
        </section>

        <section class="answer-block" aria-live="polite">
          <div class="row-between">
            <h2>回答</h2>
            <span id="mode-badge" class="badge">等待提问</span>
          </div>
          <div id="answer" class="answer empty">选择模式后提问：Graph-RAG 会沿链接扩邻居；纯向量只看文本相似。</div>
          <ul id="citations" class="citations"></ul>
        </section>

        <section class="notes-block">
          <div class="row-between">
            <h2>笔记库</h2>
            <label class="filter-wrap">
              <span class="sr-only">筛选笔记</span>
              <input id="note-filter" type="search" placeholder="筛选…" autocomplete="off" />
            </label>
          </div>
          <ul id="note-list" class="note-list"></ul>
        </section>

        <section class="note-block">
          <h2>预览</h2>
          <article id="note-view" class="note-view empty">点图或列表查看原文。</article>
        </section>
      </aside>
    </main>
  </div>
  <script src="./engine.js"></script>
  <script src="./app.js"></script>
</body>
</html>
