<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>微型蒸渗仪数据处理</title>
  <link rel="stylesheet" href="css/app.css" />
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      if (q.get("embed") === "1" || window.parent !== window) document.documentElement.classList.add("embed");
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>微型蒸渗仪数据处理</h1>
      <p class="lede">按 SmartField 中文手册处理 DT80 CSV。10 分钟只累计越过门限的增重；正式蒸散只累计真午夜、有储水瓶实测、且已确认自由度的日子。计算在浏览器里完成。</p>
      <p class="lede" style="opacity:.85">说明：内置示例是合成序列，只演示界面；旧 Python 8765 路径已废弃。本页独立于 hydro-info-platform。</p>
    </header>

    <section class="panel controls">
      <label>型号
        <select id="model">
          <option value="SFL300">SFL300 / PL-50</option>
          <option value="SFL600">SFL600 / PL-100</option>
          <option value="SFL900">SFL900 / PL-200</option>
        </select>
      </label>
      <label id="lys-wrap" hidden>蒸渗仪
        <select id="lys"></select>
      </label>
      <label>生物量 g/日（不扣除）
        <input id="biomass" type="number" min="0" step="0.1" value="0" />
      </label>
      <label>DT80 CSV
        <input id="file" type="file" accept=".csv,text/csv" />
      </label>
      <button id="run" type="button">分析上传文件</button>
      <button id="demo" class="ghost" type="button">用示例序列</button>
      <label class="check"><input id="snow" type="checkbox" /> 现场有积雪或边缘植物</label>
      <label class="check"><input id="free" type="checkbox" /> 已确认筒体和储水瓶可自由活动</label>
      <label class="check"><input id="detect-wall" type="checkbox" /> 启用碰壁检测（默认关，易误标）</label>
    </section>
    <p id="status"></p>
    <div class="downloads">
      <a id="export-flux" class="btn ghost" download="sfl-flux-10min.csv">下载 10 分钟通量</a>
      <a id="export-daily" class="btn ghost" download="sfl-daily.csv">下载午夜水平衡</a>
    </div>

    <div id="cards" class="cards"></div>
    <p id="meta"></p>
    <ul id="notes"></ul>

    <h2>重量</h2>
    <div id="weight" class="figure"></div>
    <h2>10 分钟通量</h2>
    <div id="flux" class="figure"></div>
    <h2>底部反馈</h2>
    <div id="tension" class="figure"></div>

    <h2>质控</h2>
    <div id="flags"></div>
    <h2>午夜水平衡</h2>
    <div id="daily"></div>
    <h2>传感器</h2>
    <div id="sensors"></div>
  </div>
  <script src="js/sfl.js"></script>
  <script>SFL.mount(document);</script>
</body>
</html>
