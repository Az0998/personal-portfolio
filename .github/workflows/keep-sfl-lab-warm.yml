# Keep the lysimeter classroom and personal site from spinning down
# on Render's free plan. Hits Render origins only (custom domain 403s runners).
name: Keep sfl-lab warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wake personal site and lysimeter lab
        shell: bash
        run: |
          set -u

          wake() {
            local url="$1"
            local i code
            for i in 1 2 3 4; do
              code=$(curl -sS -o /tmp/keep-alive-body -w "%{http_code}" --max-time 90 "$url" || echo 000)
              echo "$url try $i -> $code"
              if [ "$code" = "200" ]; then
                return 0
              fi
              sleep 20
            done
            echo "FAILED $url"
            return 1
          }

          fail=0
          # Hit Render origins only. The custom domain can 403 GitHub runners.
          wake "https://sfl-lab.onrender.com/api/health" || fail=1
          wake "https://sfl-lab.onrender.com/" || fail=1
          wake "https://personal-portfolio-7mu7.onrender.com/sfl-lab" || fail=1
          exit "$fail"
