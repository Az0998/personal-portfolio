server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  servlet:
    multipart:
      max-file-size: 80MB
      max-request-size: 90MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:sfl;DB_CLOSE_DELAY=-1}
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: always

sfl:
  sample-dir: classpath:sample-data
  cors-origin: "*"
